name: Cycling news bot

on:
  schedule:
    # Twice an hour (at :07 and :37) from 06:07 to 21:37 UTC (07:07-22:37 in Luxembourg in winter).
    # Off the hour on purpose: GitHub delays or drops scheduled runs set for :00 and :30.
    # Times are UTC. About 32 runs a day, roughly 1,000-1,400 of your 2,000 free minutes a month.
    - cron: "7,37 6-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [run, check, scout]
        default: run

permissions:
  contents: write    # needed to save the bot's memory (state/state.json)

concurrency:
  group: cycling-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt
          pip install -q googlenewsdecoder || echo "optional Google News link decoder not installed"

      - name: Headline font (optional)
        run: |
          [ -f assets/fonts/Anton-Regular.ttf ] || \
          curl -sfL -o assets/fonts/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_TOKEN: ${{ secrets.INSTAGRAM_APP_TOKEN }}
          TELEGRAM_BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m bot.main ${{ github.event.inputs.mode || 'run' }}

      - name: Save memory
        if: always()
        run: |
          git config user.name "cycling-bot"
          git config user.email "cycling-bot@users.noreply.github.com"
          git add state/state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: update state [skip ci]"
          git pull -q --rebase && git push -q
